name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # A hosted runner is several times slower than a dev machine. Run one package's tests
      # at a time so the property suites are not starved into timeouts, and keep going past a
      # failure so one run shows every red package.
      - run: pnpm exec turbo run test:unit --concurrency=1 --continue
      - run: pnpm exec turbo run test:api --concurrency=1 --continue
      - run: pnpm exec turbo run test:sync --concurrency=1
      # Headless runs of the machine's Chrome (ubuntu-latest ships it at /usr/bin/google-chrome)
      # against the real API on an embedded Postgres; no browser download, no Docker.
      - run: pnpm exec turbo run test:browser --concurrency=1
      - run: pnpm build
      # The release as the server installs it: tarball, checksum and manifest. Nothing is
      # pushed anywhere; the artifact is what an operator copies to a server.
      - run: pnpm release:pack
      - uses: actions/upload-artifact@v4
        with:
          name: fnb-release
          path: tmp/release-out/
          retention-days: 14
          if-no-files-found: error
      # The backup and restore drill needs pg_dump/pg_restore no older than the embedded
      # Postgres 17; the runner ships an older client, so 17 comes from the PGDG archive.
      - run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17
      - run: pnpm test:ops
        env:
          FNB_PG_BIN_DIR: /usr/lib/postgresql/17/bin
