<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f7fc" />
    <link rel="icon" href="data:," />
    <title>FNB POS</title>
    <script>
      // The till's theme before the first paint, so it never flashes another colour, and the
      // bar's colour as the browser's theme-color. Keep in step with
      // src/features/theme/till-theme.ts (its test runs this script).
      (function () {
        var theme = "pastel";
        var bar = { pastel: "#f3f7fc", rangxay: "#f4ede3", dark: "#11161d" };
        try {
          var kept = window.localStorage.getItem("fnb.theme");
          if (kept === "rangxay" || kept === "dark") theme = kept;
          else if (kept === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches)
            theme = "dark";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", bar[theme]);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
